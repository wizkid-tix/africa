.card{position:absolute;left:51.90%;top:15.15%;width:41.55%;height:64.91%;background:#000;border-radius:1.2cqw}
.card h1{position:absolute;left:2.05cqw;top:2.55cqw;font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;font-weight:400;font-size:3.75cqw;line-height:1;
  color:var(--beige);white-space:nowrap;letter-spacing:.005em}
.card h1 b{font-weight:700;color:#fff}
.card .v,.card .d{position:absolute;left:2.05cqw;font-weight:500;font-size:1.28cqw;line-height:1;color:#dcd6d0;white-space:nowrap}
.card .v{top:8.1cqw}.card .d{top:10.7cqw}
.cta{display:flex;justify-content:space-between;align-items:center;background:var(--orange);color:#fff;border:0;
  font-family:"Space Grotesk",Arial,sans-serif;font-weight:600;cursor:pointer;transition:filter .15s}
.cta:hover{filter:brightness(1.1)}.cta:disabled{opacity:.6;cursor:wait}
.card .cta{position:absolute;left:1.9cqw;top:14.3cqw;width:37.6cqw;height:5.05cqw;border-radius:.55cqw;padding:0 3.1cqw 0 2.5cqw;font-size:1.5cqw}
.card .cta svg{width:1.2cqw;height:1.6cqw}
.cta:focus-visible,.x:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #fff;outline-offset:2px}
.spons{background:#000;text-align:center;padding:26px 0 18px}
.spons h2{font-weight:400;font-size:22px;color:#e9e2dc}
.track{overflow:hidden;margin-top:34px;-webkit-mask:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.row{display:flex;gap:90px;width:max-content;align-items:center;animation:slide 40s linear infinite;padding:0 45px}
.row span{font-size:30px;color:#fff;white-space:nowrap}
.row .s1{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;font-weight:800;color:#e0355f;letter-spacing:1px}
.row .s2{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;font-weight:800;color:#e03a3a;font-size:34px}
.row .s3{font-family:Georgia,serif;font-size:36px}
.row .s4{letter-spacing:.35em;font-weight:600}
@keyframes slide{to{transform:translateX(-50%)}}
.pw{padding:10px 0 18px;text-align:center;font-size:18px}.pw a{color:var(--orange);text-decoration:none}

#checkout{display:none;background:#fff;color:#111;min-height:100vh;font-family:Arial,Helvetica,sans-serif}
body.co #home{display:none}body.co #checkout{display:block}
.cw{max-width:1760px;margin:0 auto;padding:0 5.7% 80px}
.steps{display:flex;align-items:center;gap:14px;padding-top:10px;height:56px}
.st{display:flex;align-items:center;gap:12px;font:700 25px "Space Grotesk",Arial,sans-serif;color:#9a9a9a;white-space:nowrap}
.st.on{color:#2b2b2b}
.st i{width:22px;height:22px;border-radius:50%;border:2px solid #c9c9c9;display:grid;place-items:center;flex:none}
.st.on i{background:#555;border-color:#555}
.st.on i svg{display:block}.st i svg{display:none}
.ln{flex:1;height:1px;background:#cfcfcf;min-width:12px}
.grid{display:grid;grid-template-columns:minmax(0,1008fr) minmax(0,588fr);column-gap:4.7%;margin-top:26px}
.ttl{display:flex;align-items:center;gap:26px;margin-bottom:38px;margin-top:18px}
.back{width:36px;height:36px;border-radius:9px;background:#fb6533;border:0;display:grid;place-items:center;cursor:pointer;flex:none}
.back:focus-visible,.sel:focus-visible,.btn:focus-visible,.in:focus-visible,.ap:focus-visible{outline:3px solid #111;outline-offset:2px}
h2.h{font:700 37px "Space Grotesk",Arial,sans-serif;color:#1d1d1f}
.tk{display:flex;justify-content:space-between;gap:24px;padding:46px 0 40px;border-bottom:1px solid #e9e9e9}
.tk:first-of-type{padding-top:14px}
.tk h3{font:700 27px "Space Grotesk",Arial,sans-serif;color:#1d1d1f;margin-bottom:18px}
.tk .p{font:700 28px "Space Grotesk",Arial,sans-serif;color:#fb6533;margin-bottom:26px}
.tk .ds{font-size:20px;line-height:1.65;color:#555;max-width:740px}
.tk.so h3{color:#888}.tk.so .ds{color:#aaa}.tk.so{padding-top:30px}.tk.so h3{margin-bottom:26px}
.pill{align-self:flex-start;background:#f1f1f1;color:#666;font:700 23px "Space Grotesk",Arial,sans-serif;padding:22px 24px;border-radius:12px;white-space:nowrap}
.selw{position:relative;align-self:flex-start;width:150px;flex:none}
.sel{appearance:none;-webkit-appearance:none;width:100%;height:70px;border:1px solid #e6e6e6;border-radius:12px;background:#fff;
  font:700 20px Arial,sans-serif;color:#111;text-align:center;text-align-last:center;padding-right:30px;cursor:pointer}
.selw svg{position:absolute;right:26px;top:26px;pointer-events:none}
.sm h2{font:700 38px "Space Grotesk",Arial,sans-serif;color:#1d1d1f;margin:26px 0 38px}
.card2{border:1px solid #eee;border-radius:30px;padding:40px 36px 36px}
.ev{font:700 32px "Space Grotesk",Arial,sans-serif;text-align:center;color:#000;margin-bottom:62px}
.li{display:flex;justify-content:space-between;font-size:24px;color:#666;margin-bottom:18px}
.dn{background:#fafafa;border:1px solid #f0f0f0;border-radius:14px;padding:26px 30px;text-align:center;font-size:21px;line-height:1.55;color:#444;margin:54px 0 46px}
.tot2{display:flex;justify-content:space-between;font:700 26px "Space Grotesk",Arial,sans-serif;color:#111;margin-bottom:42px}
.btn{width:100%;height:78px;border:0;border-radius:14px;background:#fb6533;color:#fff;font:500 23px Arial,sans-serif;cursor:pointer;transition:filter .15s}
.btn:hover{filter:brightness(1.06)}.btn:disabled{background:#f3b39f;cursor:not-allowed}
.err2{color:#d93a1d;font-size:17px;margin-top:14px;text-align:center;min-height:22px}
.fl{display:grid;grid-template-columns:1fr 1fr;gap:26px 24px;max-width:740px}
.fl .full{grid-column:1/-1}
.fl label{display:block;font:700 17px "Space Grotesk",Arial,sans-serif;color:#444;margin-bottom:10px}
.in{width:100%;height:66px;border:1px solid #e6e6e6;border-radius:12px;padding:0 20px;font:19px Arial,sans-serif;color:#111;background:#fff}
.rv{max-width:740px;font-size:21px;color:#444;line-height:1.7}
.rv b{color:#111}
.dc{display:flex;gap:14px;max-width:560px;margin-top:34px}
.ap{height:66px;padding:0 28px;border:1px solid #111;border-radius:12px;background:#fff;font:700 18px "Space Grotesk",Arial,sans-serif;cursor:pointer}
.okm{color:#1e8e3e;font-size:17px;margin-top:12px;min-height:22px}
.done h2{margin-bottom:14px}.done .ref{font:700 40px "Space Grotesk",Arial,sans-serif;color:#fb6533;margin:18px 0;overflow-wrap:anywhere;word-break:break-all}
.done p,.rv{overflow-wrap:anywhere}.grid>*{min-width:0}
.done p{font-size:21px;color:#444;line-height:1.6}
@media(max-width:900px){
  .done .ref{font-size:clamp(22px,7.5vw,34px)}
  .grid{grid-template-columns:1fr}.sm{order:2}.st{font-size:15px;gap:6px}.st i{width:18px;height:18px}.steps{gap:8px}.ln{min-width:6px}
  h2.h{font-size:28px}.ttl{gap:16px}.tk h3{font-size:22px}.tk .p{font-size:22px}.tk .ds{font-size:16px}

  .sm h2{font-size:30px}.ev{font-size:24px;margin-bottom:34px}.li{font-size:18px}.dn{font-size:16px;margin:30px 0}
  .fl{grid-template-columns:1fr}
}

  <div class="grid">
    <section id="main"></section>
    <aside class="sm">
      <h2>Summary</h2>
      <div class="card2">
        <div class="ev">WIZKID LIVE ABUJA</div>
        <div id="lines"></div>
        <div class="dn" id="dn">Discount codes are now added at the payment step.</div>
        <div class="tot2"><span>Total</span><span id="tot"></span></div>
        <button class="btn" id="go">Continue</button>
        <div class="err2" id="err" role="alert"></div>
      </div>
    </aside>
  </div>
</div>
</main>
<div id="bar"><div class="err2" id="errb" role="alert"></div><div class="r"><div class="t"><small>Total</small><span id="bt"></span></div><button class="btn" id="bgo">Continue</button></div></div>
<script src="https://js.paystack.co/v2/inline.js"></script>
<script>
const $ = id => document.getElementById(id);
const naira = n => "₦" + n.toLocaleString("en-NG");

// ---- CONFIG ----
const PAYSTACK_PUBLIC_KEY = "pk_live_261433872473e37ee07e8a98017c97b7360241f8";   // Paystack dashboard > Settings > API Keys
const VERIFY_URL = "";                              // your server's /verify URL (see paystack-server.js). Empty = no server-side check
const LARGE = 1000000;                              // naira; from this amount up, Bank Transfer is listed first and USSD is hidden
const DISCOUNTS = { WIZ10: 10 };                    // code -> percent off (client-side only)
const TIERS = [
  {id:"early", name:"Standard Early Bird", price:40000, soldOut:true,
   desc:"Get early access to the Wizkid Live Abuja experience at a special early bird price."},
  {id:"standard", name:"Standard", price:50000,
   desc:"Your Standard ticket gives you access to an unforgettable night of live music, entertainment, and the festival experience as Wizkid takes the stage in Abuja."},
  {id:"gold", name:"Gold Table", price:2562500,
   desc:"Table for 8. Enjoy Wizkid Live in Abuja with your crew in our Gold Table section, with bottle service and a dedicated host."},
];
const SPONSORS = ["Nova Flair","Lord's London Dry Gin","Hennessy","Desperados","Best","AXE","Heineken","Transcorp"];
// ----------------

// sponsors
const cls = ["s1","s2","s3","s2","s3","s4","s3","s4"];
const items = SPONSORS.map((s,i) => `<span class="${cls[i%cls.length]}">${s}</span>`).join("");
$("row").innerHTML = items + items;

// state
let step = 1, stdAuto = true, paying = false, qty = {standard:1}, contact = {first:"",last:"",email:"",phone:""}, disc = {code:"",pct:0}, paid = null;
const sub = () => TIERS.reduce((s,t) => s + t.price * (qty[t.id]||0), 0);
const total = () => Math.round(sub() * (1 - disc.pct/100));
const count = () => TIERS.reduce((s,t) => s + (qty[t.id]||0), 0);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const CHEV = '<svg width="16" height="10" viewBox="0 0 16 10" fill="none" stroke="#222" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2l6 6 6-6"/></svg>';
const ARROW = '<svg width="22" height="18" viewBox="0 0 22 18" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 9H3M9 2L2 9l7 7"/></svg>';

function renderSteps(){
  document.querySelectorAll(".st").forEach(el => el.classList.toggle("on", +el.dataset.s <= Math.min(step,3)));
}
function renderSummary(){
  $("lines").innerHTML = TIERS.filter(t => qty[t.id] > 0).map(t =>
    `<div class="li"><span>${qty[t.id]} × ${esc(t.name)}</span><span>${naira(t.price*qty[t.id])}</span></div>`).join("");
  if (disc.pct) $("lines").innerHTML += `<div class="li"><span>Discount (${esc(disc.code)})</span><span>-${naira(sub()-total())}</span></div>`;
  $("tot").textContent = naira(total());
  $("dn").style.display = step >= 3 ? "none" : "";
  $("go").style.display = step > 3 ? "none" : "";
  $("go").textContent = step === 3 ? "Pay " + naira(total()) : "Continue";
  $("go").disabled = count() === 0;
  $("err").textContent = ""; $("errb").textContent = "";
  $("bt").textContent = naira(total()); $("bgo").textContent = $("go").textContent; $("bgo").disabled = count() === 0;
  document.body.classList.toggle("bar", step <= 3);
}
function render(){
  renderSteps();
  const m = $("main");
  if (step === 1){
    m.innerHTML = `<div class="ttl"><button class="back" id="bk" aria-label="Back">${ARROW}</button><h2 class="h">Choose Tickets</h2></div>` +
      TIERS.map(t => t.soldOut
        ? `<div class="tk so"><div><h3>${esc(t.name)}</h3><div class="ds">${esc(t.desc)}</div></div><div class="pill">Sold Out</div></div>`
        : `<div class="tk"><div><h3>${esc(t.name)}</h3><div class="p">${naira(t.price)}</div><div class="ds">${esc(t.desc)}</div></div>
            <div class="selw"><select class="sel" data-id="${t.id}" aria-label="${esc(t.name)} quantity">${Array.from({length:11},(_,i)=>`<option${(qty[t.id]||0)===i?" selected":""}>${i}</option>`).join("")}</select>${CHEV}</div></div>`).join("");
    m.querySelectorAll(".sel").forEach(s => s.onchange = () => {
      const id = s.dataset.id, was = qty[id] || 0;
      qty[id] = +s.value;
      if (id === "standard") stdAuto = false;
      else if (stdAuto && qty.standard === 1 && was === 0 && qty[id] > 0) {   // untouched default Standard ticket: drop it
        qty.standard = 0; stdAuto = false;
        const sd = m.querySelector('.sel[data-id="standard"]'); if (sd) sd.value = "0";
      }
      renderSummary();
    });
  } else if (step === 2){
    m.innerHTML = `<div class="ttl"><button class="back" id="bk" aria-label="Back">${ARROW}</button><h2 class="h">Contact Details</h2></div>
      <div class="fl">
        <div><label for="f1">First name</label><input class="in" id="f1" autocomplete="given-name" value="${esc(contact.first)}"></div>
        <div><label for="f2">Last name</label><input class="in" id="f2" autocomplete="family-name" value="${esc(contact.last)}"></div>
        <div class="full"><label for="f3">Email</label><input class="in" id="f3" type="email" autocomplete="email" value="${esc(contact.email)}"></div>
        <div class="full"><label for="f4">Phone number</label><input class="in" id="f4" type="tel" autocomplete="tel" value="${esc(contact.phone)}"></div>
      </div>`;
    $("f1").focus();
  } else if (step === 3){
    m.innerHTML = `<div class="ttl"><button class="back" id="bk" aria-label="Back">${ARROW}</button><h2 class="h">Payment</h2></div>
      <div class="rv"><b>${esc(contact.first)} ${esc(contact.last)}</b><br>${esc(contact.email)} · ${esc(contact.phone)}<br><br>
      You'll pay securely with Paystack.${total() >= LARGE ? " For large amounts, choose <b>Bank Transfer</b>. Banks often block big card payments." : ""}</div>
      <div class="dc"><input class="in" id="dcode" placeholder="Discount code" aria-label="Discount code" value="${esc(disc.code)}"><button class="ap" id="ap">Apply</button></div>
      <div class="okm" id="dm">${disc.pct ? disc.pct + "% discount applied" : ""}</div>`;
    $("ap").onclick = () => {
      const c = $("dcode").value.trim().toUpperCase();
      if (!c) { disc = {code:"",pct:0}; $("dm").textContent = ""; }
      else if (Object.prototype.hasOwnProperty.call(DISCOUNTS,c)) { disc = {code:c,pct:DISCOUNTS[c]}; $("dm").style.color = "#1e8e3e"; $("dm").textContent = DISCOUNTS[c] + "% discount applied"; }
      else { disc = {code:"",pct:0}; $("dm").style.color = "#d93a1d"; $("dm").textContent = "Invalid discount code"; }
      renderSummary();
    };
  } else {
    const st = paid.state;
    const msg = st === "checking" ? "Confirming your payment…"
      : st === "failed" ? "We couldn't confirm your payment yet. <b>Do not pay again.</b> If you were charged, contact us with your reference below."
      : `Payment received. Your ticket (ID <b>${ticketId(paid)}</b>) is downloading to this device. Confirmation goes to <b>${esc(contact.email)}</b>.`;
    m.innerHTML = `<div class="done"><h2 class="h">${st === "failed" ? "Payment pending" : st === "checking" ? "Almost there" : "You're in"}</h2><p>${msg}</p>
      <div class="ref">${esc(paid.reference)}</div><p>Keep this reference. You'll need it at the gate.</p>${st === "failed" ? '<button class="ap" id="rt">Check again</button>' : ""}${st === "ok" ? '<button class="ap" id="dl">Download ticket</button>' : ""}</div>`;
    const dl = $("dl"); if (dl) dl.onclick = () => downloadTicket(paid, true);
    const rt = $("rt"); if (rt) rt.onclick = () => confirmOrder(paid);
  }
  const bk = $("bk"); if (bk) bk.onclick = back;
  renderSummary();
  scrollTo(0,0);
}
function back(){ if (step === 1) { history.back(); } else { step--; render(); } }

function showErr(m){ $("err").textContent = m; $("errb").textContent = m; }
function lock(on){
  paying = on;
  const dis = on || count() === 0;
  $("go").disabled = dis; $("bgo").disabled = dis;
  const label = on ? "Opening payment…" : "Pay " + naira(total());
  $("go").textContent = label; $("bgo").textContent = label;
}
function newRef(){
  const r = crypto.getRandomValues(new Uint8Array(4));
  return "WKD" + Date.now().toString(36).toUpperCase() + Array.from(r, b => b.toString(16).padStart(2,"0")).join("").toUpperCase();
}
const clearPending = () => { try { localStorage.removeItem("pending"); } catch {} };
function saveOrder(o){
  try { const all = JSON.parse(localStorage.getItem("orders")||"[]"); if (!all.some(x => x.reference === o.reference)) { all.push(o); localStorage.setItem("orders", JSON.stringify(all)); } } catch {}
}
function verifyBody(o){
  return JSON.stringify({reference:o.reference, items:o.items.map(l => ({tier:l.tier, qty:l.qty})), discount:o.discount, contact:o.contact});
}
function confirmOrder(o){
  o.state = "checking"; if (step === 4 && paid === o) render();
  return fetch(VERIFY_URL, {method:"POST", headers:{"Content-Type":"application/json"}, keepalive:true, body: verifyBody(o)})
    .then(r => r.json().catch(() => ({})).then(j => { o.state = (r.ok && j && j.ok) ? "ok" : "failed"; }))
    .catch(() => { o.state = "failed"; })
    .finally(() => { if (o.state === "ok") { clearPending(); downloadTicket(o); } if (step === 4 && paid === o) render(); });
}
function pay(){
  if (paying) return;
  if (PAYSTACK_PUBLIC_KEY.includes("REPLACE_ME")) return showErr("Set PAYSTACK_PUBLIC_KEY in the file first.");
  if (typeof PaystackPop === "undefined") return showErr("Could not load Paystack. Check your connection and refresh.");
  const lines = TIERS.filter(t => qty[t.id] > 0).map(t => ({tier:t.id, name:t.name, qty:qty[t.id], unit:t.price}));
  const amountKobo = Math.round(total()) * 100;
  if (!lines.length || !Number.isInteger(amountKobo) || amountKobo < 10000) return showErr("Select at least one ticket.");
  const ref = newRef();
  lock(true); showErr("");
  try { localStorage.setItem("pending", JSON.stringify({reference:ref, items:lines, discount:disc.code, contact, total:total(), t:Date.now()})); } catch {}
  setTimeout(() => { if (paying) lock(false); }, 25000);   // never leave the button stuck if the popup is blocked
  const fail = msg => { lock(false); showErr(msg || "Payment could not start. Try again, or use Bank Transfer for large amounts."); };
  try {
    const popup = new PaystackPop();
    popup.newTransaction({
      key: PAYSTACK_PUBLIC_KEY,
      email: contact.email,
      amount: amountKobo,
      currency: "NGN",
      ref: ref, reference: ref,
      firstName: contact.first, lastName: contact.last, phone: contact.phone,
      channels: amountKobo >= LARGE * 100 ? ["bank_transfer", "card", "bank"] : ["card", "bank_transfer", "bank", "ussd"],
      metadata: {
        items: lines, discount: disc.code,
        custom_fields: [
          {display_name:"Name", variable_name:"name", value: contact.first + " " + contact.last},
          {display_name:"Phone", variable_name:"phone", value: contact.phone},
          {display_name:"Tickets", variable_name:"tickets", value: lines.map(l => l.qty + "x " + l.name).join(", ")}
        ]
      },
      onSuccess: (tx) => {
        const order = { reference: (tx && (tx.reference || tx.trxref)) || ref, contact, items: lines, discount: disc.code,
                        total: total(), state: VERIFY_URL ? "checking" : "ok", createdAt: new Date().toISOString() };
        saveOrder(order);
        paid = order; lock(false);          // qty/disc stay as paid so the summary on the receipt screen is correct
        step = 4; render();
        if (VERIFY_URL) confirmOrder(order); else { clearPending(); downloadTicket(order); }
      },
      onCancel: () => lock(false),
      onError: (err) => fail(err && err.message)
    });
  } catch (e) { fail(e && e.message); }
}


// ---- TICKET IMAGE ----
const ADMITS = {early:1, standard:1, gold:8};
const ticketId = o => "TKT-" + String(o.reference).replace(/[^A-Za-z0-9]/g,"").slice(-8).toUpperCase();
function loadImg(src){ return new Promise((res,rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
async function makeTicket(o){
  try { await Promise.all([document.fonts.load('700 60px "Barlow Condensed"'), document.fonts.load('700 40px "Space Grotesk"'), document.fonts.load('400 40px "Space Grotesk"')]); } catch {}
  const W = 1500, H = 640, STUB = 1080, F = "'Space Grotesk',Arial,sans-serif", FC = "'Barlow Condensed','Arial Narrow',Arial,sans-serif";
  const c = document.createElement("canvas"); c.width = W; c.height = H; const x = c.getContext("2d");
  const id = ticketId(o);
  x.fillStyle = "#000"; x.fillRect(0,0,W,H);
  // Wizkid watermark (reuses the hero image already embedded in this page)
  try {
    const css = Array.from(document.querySelectorAll("style"), e => e.textContent).join(""), all = css.match(/data:image\/jpeg;base64,[A-Za-z0-9+\/=]+/g) || [];
    const src = all[1] || all[0];   // clean Wizkid photo (no button card)
    if (src) {
      const im = await loadImg(src), k = Math.max(W/im.width, H/im.height), w = im.width*k, h = im.height*k;
      x.globalAlpha = .38; x.drawImage(im, (W-w)/2, (H-h)/2, w, h); x.globalAlpha = 1;
      x.fillStyle = "rgba(0,0,0,.35)"; x.fillRect(0,0,W,H);
    }
  } catch {}
  // accent strip + border
  x.fillStyle = "#e85d14"; x.fillRect(0,0,24,H);
  x.strokeStyle = "rgba(240,220,205,.35)"; x.lineWidth = 3; x.strokeRect(1.5,1.5,W-3,H-3);
  const t = (txt, px, py, font, col, al) => { x.font = font; x.fillStyle = col; x.textAlign = al || "left"; x.fillText(txt, px, py); };
  const fit = (txt, max) => { while (x.measureText(txt).width > max && txt.length > 4) txt = txt.slice(0,-2); return txt; };
  // header
  t("OFFICIAL ENTRY TICKET", 70, 70, "600 26px "+F, "#e85d14");
  let ts = 92; x.font = "700 " + ts + "px "+FC;
  while (ts > 40 && (x.measureText("WIZKID ").width + (x.font = "400 " + ts + "px "+FC, x.measureText("LIVE IN ABUJA").width) + (x.font = "700 " + ts + "px "+FC, 0)) > STUB-140) { ts -= 2; x.font = "700 " + ts + "px "+FC; }
  const wz = x.measureText("WIZKID ").width;
  t("WIZKID", 70, 160, "700 " + ts + "px "+FC, "#fff"); t("LIVE IN ABUJA", 70+wz, 160, "400 " + ts + "px "+FC, "#f0dccd");
  t("Eagle Square, Abuja  •  13 December 2026", 70, 208, "500 30px "+F, "#d9d9d9");
  // holder
  const name = (o.contact.first + " " + o.contact.last).toUpperCase();
  t("TICKET HOLDER", 70, 285, "600 22px "+F, "#e85d14");
  x.font = "700 46px "+F; t(fit(name, STUB-140), 70, 337, "700 46px "+F, "#fff");
  x.font = "400 26px "+F; t(fit(o.contact.email, 480), 70, 380, "400 26px "+F, "#d9d9d9");
  t(o.contact.phone, 70, 416, "400 26px "+F, "#d9d9d9");
  // ticket type(s)
  t("TICKET", 600, 285, "600 22px "+F, "#e85d14");
  o.items.slice(0,3).forEach((l,i) => t(fit(l.qty + " × " + l.name, 400), 600, 330 + i*40, "600 30px "+F, "#fff"));
  const admits = o.items.reduce((s,l) => s + l.qty*(ADMITS[l.tier]||1), 0);
  t("ADMITS " + admits, 600, 330 + Math.min(o.items.length,3)*40 + 6, "700 26px "+F, "#f0dccd");
  // footer
  t("PAID  ₦" + Number(o.total).toLocaleString("en-NG"), 70, 500, "700 34px "+F, "#fb6533");
  t("Ref: " + o.reference, 70, 545, "400 22px "+F, "#bdbdbd");
  t("Present this ticket at the gate. One entry per person. Not transferable.", 70, 595, "400 20px "+F, "#9a9a9a");
  // perforation
  x.setLineDash([12,12]); x.strokeStyle = "rgba(240,220,205,.6)"; x.lineWidth = 3;
  x.beginPath(); x.moveTo(STUB,30); x.lineTo(STUB,H-30); x.stroke(); x.setLineDash([]);
  x.fillStyle = "#000"; [0,H].forEach(yy => { x.beginPath(); x.arc(STUB,yy,26,0,7); x.fill(); });
  // stub with ticket ID
  const cx = STUB + (W-STUB)/2;
  t("TICKET ID", cx, 250, "600 24px "+F, "#e85d14", "center");
  t(id.slice(0,4), cx, 330, "700 56px "+F, "#fff", "center");
  t(id.slice(4), cx, 400, "700 56px "+F, "#fff", "center");
  t("WIZKID LIVE", cx, 500, "700 40px "+FC, "#f0dccd", "center");
  t("ABUJA 2026", cx, 540, "400 32px "+FC, "#f0dccd", "center");
  return new Promise(res => c.toBlob(res, "image/png"));
}
function downloadTicket(o, force){
  if (!o || (o.dl && !force)) return;
  o.dl = true;
  makeTicket(o).then(b => {
    const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "Wizkid-Ticket-" + ticketId(o) + ".png";
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }).catch(() => { o.dl = false; });
}
// ----------------------

const goNext = () => {
  if (count() === 0) return;
  if (step === 1) { step = 2; render(); }
  else if (step === 2){
    contact = { first:$("f1").value.trim(), last:$("f2").value.trim(), email:$("f3").value.trim().toLowerCase(), phone:$("f4").value.trim() };
    if (!contact.first || !contact.last) return showErr("Enter your first and last name");
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(contact.email)) return showErr("Enter a valid email");
    if (contact.phone.replace(/\D/g,"").length < 10) return showErr("Enter a valid phone number");
    step = 3; render();
  } else if (step === 3) pay();
};

$("go").onclick = goNext; $("bgo").onclick = goNext;

// navigation between home and checkout
$("open").onclick = () => { step = 1; paid = null; qty = {standard:1}; stdAuto = true; disc = {code:"",pct:0}; document.body.classList.add("co"); history.pushState({co:1}, ""); render(); };
addEventListener("popstate", () => { document.body.classList.remove("co"); scrollTo(0,0); });

// If the page reloaded mid-payment (bank app switch, 3DS), confirm the pending order and show the receipt.
(function restore(){
  if (!VERIFY_URL) return;
  let p = null; try { p = JSON.parse(localStorage.getItem("pending") || "null"); } catch {}
  if (!p || !p.reference || Date.now() - p.t > 2*864e5) { clearPending(); return; }
  const o = { reference:p.reference, contact:p.contact, items:p.items, discount:p.discount, total:p.total, state:"checking", createdAt:new Date(p.t).toISOString() };
  fetch(VERIFY_URL, {method:"POST", headers:{"Content-Type":"application/json"}, body: verifyBody(o)})
    .then(r => r.json().catch(() => ({})).then(j => {
      if (!(r.ok && j && j.ok) || (paid && paid.reference === o.reference)) return;
      o.state = "ok"; saveOrder(o); clearPending(); downloadTicket(o);
      contact = o.contact; qty = {}; o.items.forEach(l => qty[l.tier] = l.qty);
      disc = Object.prototype.hasOwnProperty.call(DISCOUNTS, o.discount) ? {code:o.discount, pct:DISCOUNTS[o.discount]} : {code:"",pct:0};
      paid = o; step = 4; document.body.classList.add("co"); history.pushState({co:1}, ""); render();
    })).catch(() => {});
})();
</script>
</body></html>
